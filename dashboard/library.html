<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thư viện – AI Speaking Coach</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="../logo.png" alt="Logo" class="logo-img" />
      <div class="logo-text"><span class="logo-title">AI SPEAKING</span><span class="logo-subtitle">COACH</span></div>
    </div>
    <nav class="sidebar-nav">
      <a href="index.html"   class="nav-item"><span class="nav-icon"><svg width="20" height="20" fill="none" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5" fill="currentColor" opacity=".9"/><rect x="14" y="3" width="7" height="7" rx="1.5" fill="currentColor" opacity=".5"/><rect x="3" y="14" width="7" height="7" rx="1.5" fill="currentColor" opacity=".5"/><rect x="14" y="14" width="7" height="7" rx="1.5" fill="currentColor" opacity=".5"/></svg></span><span>Dashboard</span></a>
      <a href="practice.html" class="nav-item"><span class="nav-icon"><svg width="20" height="20" fill="none" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg></span><span>Practice</span></a>
      <a href="#" class="nav-item nav-item-locked"><span class="nav-icon"><svg width="20" height="20" fill="none" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span><span>Mock test</span><span class="nav-badge-lock">🔒</span></a>
      <a href="library.html" class="nav-item active"><span class="nav-icon"><svg width="20" height="20" fill="none" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M3 9h18M9 21V9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span><span>Library</span></a>
      <a href="guide.html"   class="nav-item"><span class="nav-icon"><svg width="20" height="20" fill="none" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 8v1m0 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span><span>Hướng dẫn</span></a>
    </nav>
    <div class="sidebar-user">
      <div class="user-avatar">M</div>
      <div class="user-info"><span class="user-name">Minh</span><span class="user-role">Tài khoản của tôi</span></div>
      <span class="user-chevron">›</span>
    </div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <h1 class="greeting" style="font-size:24px;">Thư viện buổi luyện</h1>
      </div>
      <div class="topbar-right">
        <a href="index.html" class="btn-primary" style="font-size:13.5px;padding:10px 20px;">
          <svg width="16" height="16" fill="none" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="white" stroke-width="2" stroke-linecap="round"/></svg>
          Buổi luyện mới
        </a>
      </div>
    </header>

    <!-- Filter bar -->
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="prompt-chip" style="background:var(--primary);color:#fff;border-color:var(--primary);">Tất cả</button>
      <button class="prompt-chip">Hội thoại tự do</button>
      <button class="prompt-chip">TED Talks</button>
      <button class="prompt-chip">Vlogs</button>
    </div>

    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-top:8px;" id="library-grid"></div>
  </main>

  <script>
    const LIBRARY = [
      { id:'ses_001', title:'Review: Modern Architecture', date:'2026-07-04', duration:'12 phút', turns:8,  color:['#4338ca','#06b6d4'] },
      { id:'ses_002', title:'Travel Vlog: Tokyo Night',    date:'2026-07-03', duration:'9 phút',  turns:6,  color:['#0891b2','#6366f1'] },
      { id:'ses_003', title:'TED Talk: Power of Habits',   date:'2026-07-02', duration:'15 phút', turns:11, color:['#7c3aed','#2563eb'] },
      { id:'ses_004', title:'Science: Black Holes',        date:'2026-07-01', duration:'8 phút',  turns:5,  color:['#0f766e','#0891b2'] },
    ];

    document.getElementById('library-grid').innerHTML = LIBRARY.map(s => `
      <div class="hero-card" style="cursor:pointer;transition:transform .2s,box-shadow .2s;" onclick="window.location.href='call.html?sessionId=${s.id}'" onmouseenter="this.style.transform='translateY(-3px)';this.style.boxShadow='0 8px 28px rgba(0,0,0,.10)'" onmouseleave="this.style.transform='';this.style.boxShadow=''">
        <div style="width:100%;height:80px;background:linear-gradient(135deg,${s.color[0]},${s.color[1]});border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;">
          <svg width="28" height="28" fill="none" viewBox="0 0 24 24"><rect x="2" y="7" width="15" height="10" rx="2" stroke="white" stroke-width="1.8"/><path d="M17 9l5-3v12l-5-3" stroke="white" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </div>
        <div style="font-weight:700;font-size:15px;margin-bottom:4px;">${s.title}</div>
        <div style="font-size:12px;color:var(--text-muted);margin-bottom:12px;">${s.date} · ${s.duration} · ${s.turns} lượt nói</div>
        <div style="display:flex;gap:8px;align-items:center;">
          <span class="session-tag">Hội thoại tự do</span>
          <span style="margin-left:auto;font-size:12px;color:var(--primary-light);font-weight:600;">Tiếp tục →</span>
        </div>
      </div>
    `).join('');

    // Prompt chip toggle
    document.querySelectorAll('.prompt-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.prompt-chip').forEach(b => { b.style.background=''; b.style.color=''; b.style.borderColor=''; });
        btn.style.background = 'var(--primary)';
        btn.style.color = '#fff';
        btn.style.borderColor = 'var(--primary)';
      });
    });
  </script>
  <style>
    .prompt-chip { font-size:13px;font-weight:500;padding:7px 16px;border-radius:999px;background:var(--primary-pale);color:var(--primary);border:1.5px solid rgba(99,102,241,.2);cursor:pointer;transition:all .15s;font-family:inherit; }
    .prompt-chip:hover { background:var(--primary);color:#fff; }
  </style>
</body>
</html>
